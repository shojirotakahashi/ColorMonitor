<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorMonitor 閲覧</title>
<style>body{font-family:system-ui,'Yu Gothic UI',sans-serif;background:#f4f7fb;color:#1b2b41;max-width:820px;margin:20px auto;padding:0 16px}section{background:white;padding:20px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 12px #17253b13}input,select,button{font:inherit;padding:11px;border:1px solid #aab5c5;border-radius:8px;box-sizing:border-box}input{width:100%;margin:5px 0 12px}select{max-width:100%;width:100%}button{background:#1266b8;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5}#swatch{height:42vh;min-height:220px;max-height:500px;background:#bbb;border-radius:14px;display:grid;place-items:center;text-align:center;font-size:clamp(25px,5vw,46px);font-weight:750;overflow-wrap:anywhere;padding:10px}#meta,#status{color:#526070;overflow-wrap:anywhere}small{color:#526070}label{display:block}h1{font-size:1.5rem}h2{font-size:1.15rem}</style>
</head><body><h1>ColorMonitor 閲覧画面</h1>
<section id="loginPanel"><h2>ログイン</h2><label>Project URL<input id="url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label><label>Publishable key<input id="key" placeholder="sb_publishable_..." autocomplete="off"></label><label>閲覧者メール<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login">ログイン</button><p id="loginMsg" role="status"></p><small>ログイン情報はHTMLに埋め込まれていません。パスワードは保存しません。</small></section>
<section id="monitorPanel" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>監視状態</h2><button id="logout">ログアウト</button></div><label>監視ポイント<select id="point"></select></label><div id="swatch" style="margin-top:16px">受信待ち</div><p id="meta"></p><p id="status" role="status"></p><small>色は最新受信値を維持します。Realtime通知を優先し、接続できない場合も定期取得で更新します。通信停止中の色は現在値とは限りません。</small></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';const $=id=>document.getElementById(id);let client=null,channel=null,session=null,points=[],timer=null,busy=false,online=false,lastUpdate=0;
function status(t){$('status').textContent=t}
function render(){const p=points.find(p=>String(p.point_no)===$('point').value);if(!p){$('swatch').style.background='#bbb';$('swatch').textContent='監視ポイントがありません';$('meta').textContent='';return;}$('swatch').style.background=`rgb(${p.red},${p.green},${p.blue})`;$('swatch').textContent=p.label||'No.'+p.point_no;$('meta').textContent=`RGB (${p.red}, ${p.green}, ${p.blue}) ／ 判定：${p.color_name} ／ 最終送信：${new Date(p.updated_at).toLocaleTimeString('ja-JP')}`;}
function apply(data){points=(data||[]).sort((a,b)=>a.point_no-b.point_no);const sel=$('point'),old=sel.value;const sig=points.map(p=>`${p.point_no}:${p.label}`).join('|');if(sel.dataset.sig!==sig){sel.replaceChildren(...points.map(p=>new Option(p.label||`No.${p.point_no}`,String(p.point_no))));sel.dataset.sig=sig;if(points.some(p=>String(p.point_no)===old))sel.value=old;}render();lastUpdate=Date.now();}
async function load(){if(!client||busy)return;busy=true;try{const {data,error}=await client.from('color_points').select('point_no,label,red,green,blue,color_name,updated_at').order('point_no',{ascending:true});if(error)throw error;apply(data);status(online?'Realtime接続中・データ取得正常':'定期取得中・データ取得正常');}catch(e){status('通信エラー：'+e.message+'（最後の色は維持）')}finally{busy=false}}
$('login').onclick=async()=>{const btn=$('login');btn.disabled=true;$('loginMsg').textContent='認証中...';try{if(!window.supabase?.createClient)throw Error('通信ライブラリを読み込めません。インターネット接続を確認してください');const url=$('url').value.trim().replace(/\/+$/,'').toLowerCase(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_'))throw Error('Project URLまたはPublishable keyを確認してください');client=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;$('password').value='';$('loginPanel').hidden=true;$('monitorPanel').hidden=false;await load();channel=client.channel('color-monitor-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'color_points'},()=>{load()}).subscribe((state)=>{online=state==='SUBSCRIBED';if(state==='CHANNEL_ERROR'||state==='TIMED_OUT')status('Realtime接続待ち・定期取得で継続');else if(online)status('Realtime接続中')});timer=setInterval(load,2000);}catch(e){$('loginMsg').textContent='ログイン失敗：'+e.message;client=null}finally{btn.disabled=false}};
$('point').onchange=render;
$('logout').onclick=async()=>{if(timer)clearInterval(timer);timer=null;if(client&&channel)await client.removeChannel(channel);if(client)await client.auth.signOut();client=null;channel=null;session=null;points=[];online=false;$('point').dataset.sig='';$('monitorPanel').hidden=true;$('loginPanel').hidden=false};
</script></body></html>
